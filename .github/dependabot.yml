# Dependabot — tailored to the ecosystems actually present in this repo.
version: 2
updates:
  # GitHub Actions (all repos have workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci:"

# python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(pip):"

