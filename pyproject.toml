[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set. Without this CI runs ruff against whatever its current
# defaults are, which broke the build once already. Keep this list deliberate:
# E4/E7/E9 = real syntax problems, F = pyflakes (unused/undefined names).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The vouches panel builds HTML with %-style formatting on purpose.
"utils/db.py" = ["E712"]
